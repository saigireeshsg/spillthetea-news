<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Spill post kit</title>
<style>
:root{--bg:#0b0e14;--card:#141922;--line:#ffffff22;--t:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.45 system-ui,sans-serif;padding:16px;max-width:980px;margin:auto}
h1{font-size:22px;margin:0 0 4px}.sub{opacity:.7;margin:0 0 14px;font-size:13px}.bar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}.bar button,.btn{border:1px solid var(--line);background:#ffffff12;color:inherit;border-radius:999px;padding:8px 14px;font:700 13px inherit;cursor:pointer}.bar button[aria-pressed=true]{background:#fff;color:#111}
.car{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 18px}.car h2{margin:0 0 2px;font-size:18px}.meta{opacity:.65;font-size:12px;margin:0 0 10px}
.strip{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}.wrap{flex:none;position:relative}
.slide{position:absolute;left:0;top:0;transform-origin:0 0;width:1080px;background:#0d1017;color:#fff;overflow:hidden;font-family:system-ui,'Segoe UI',Roboto,sans-serif}
.slide .im{position:absolute;inset:0;background-size:cover;background-position:center}.slide .ov{position:absolute;inset:0}
.slide .in{position:absolute;inset:0;padding:72px 72px 64px;display:flex;flex-direction:column;justify-content:flex-end;gap:26px}
.tag{align-self:flex-start;font:800 28px/1 inherit;letter-spacing:.12em;text-transform:uppercase;background:#ff4500;color:#fff;padding:12px 20px;border-radius:12px}
.h{font-weight:900;letter-spacing:-.02em;line-height:1.06;margin:0}.b{font-size:42px;line-height:1.34;margin:0;opacity:.95}.big{font-weight:900;color:#ffb84d;line-height:1}
.ft{display:flex;justify-content:space-between;align-items:center;font:600 26px/1.2 inherit;opacity:.8;gap:20px}.ft b{font-weight:900}
.s-fact .in,.s-explain .in{justify-content:center;padding-top:72px}.s-fact .ov,.s-explain .ov{background:linear-gradient(180deg,#0d1017,#141a26)}
.thumb{height:420px;border-radius:24px;background-size:cover;background-position:center;flex:none}
.cap{margin-top:10px;display:grid;gap:8px}.cap details{background:#ffffff0a;border-radius:10px;padding:8px 12px}.cap summary{cursor:pointer;font-weight:800;font-size:13px}.cap pre{white-space:pre-wrap;font:13px/1.45 inherit;margin:8px 0 6px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}#msg{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#fff;color:#111;border-radius:999px;padding:8px 16px;font-weight:700;display:none}
</style></head><body>
<h1>Spill post kit</h1><p class="sub">Ready-to-post carousels. Pick a size, download slides as PNG, copy the caption. Images are credited to the publisher on each slide.</p>
<div class="bar" id="fmt" role="group" aria-label="Size"><button data-f="45" aria-pressed="true">4:5 · Instagram, LinkedIn</button><button data-f="169" aria-pressed="false">16:9 · X, YouTube</button><button data-f="916" aria-pressed="false">9:16 · Shorts, Reels</button></div>
<div id="list"><p class="sub">Loading…</p></div><div id="msg"></div>
<script src="/config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function(){
const C=window.SPILL_CONFIG||{},E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SZ={45:[1080,1350],169:[1920,1080],916:[1080,1920]};let fmt="45",data=[];
const prox=u=>u?C.supabaseUrl+"/functions/v1/img-proxy?u="+encodeURIComponent(u):"";
const msg=t=>{const m=document.getElementById("msg");m.textContent=t;m.style.display="block";setTimeout(()=>m.style.display="none",1800)};
function slideHTML(s,i,n,c){const [W,H]=SZ[fmt],wide=fmt==="169",k=s.k||"explain",img=prox(s.img);
  const credit=[s.credit?"Image: "+s.credit:"",c.src?"Source: "+c.src:""].filter(Boolean).join(" · ");
  const ft=`<div class="ft"><b>spillthetea.news</b><span>${E(credit)}</span><span>${i+1}/${n}</span></div>`;
  const hs=k==="cover"?(wide?96:84):(wide?68:60);
  if(k==="cover")return `<div class="slide s-cover" style="width:${W}px;height:${H}px"><div class="im" style="background-image:url('${E(img)}')"></div><div class="ov" style="background:linear-gradient(180deg,#0d101733 0%,#0d1017cc 55%,#0d1017f5 100%)"></div><div class="in"><span class="tag">${E(s.tag||"Hyderabad")}</span><h3 class="h" style="font-size:${hs}px">${E(s.head)}</h3>${s.body?`<p class="b">${E(s.body)}</p>`:""}${ft}</div></div>`;
  const th=img&&!wide?`<div class="thumb" style="background-image:url('${E(img)}')"></div>`:"";
  return `<div class="slide s-${k}" style="width:${W}px;height:${H}px">${img&&wide?`<div class="im" style="background-image:url('${E(img)}');left:56%"></div>`:""}<div class="ov"></div><div class="in" style="${wide&&img?"padding-right:50%":""}">${s.big?`<div class="big" style="font-size:${wide?170:200}px">${E(s.big)}</div>`:""}<h3 class="h" style="font-size:${hs}px">${E(s.head)}</h3>${th}<p class="b" style="font-size:${th||s.big?44:58}px">${E(s.body||"")}</p>${ft}</div></div>`}
function render(){const L=document.getElementById("list");if(!data.length){L.innerHTML='<p class="sub">No carousels yet. The morning, midday and evening runs add them.</p>';return}
  const [W,H]=SZ[fmt],sc=Math.min(300/W*(fmt==="169"?1.6:1),0.35),pw=W*sc,ph=H*sc;
  L.innerHTML=data.map((r,ci)=>{const c=r.data,sl=c.slides||[];return `<section class="car"><h2>${E(c.title)}</h2><p class="meta">${E(c.slot||"")} · ${E(r.id)}</p><div class="strip">${sl.map((s,i)=>`<div class="wrap" style="width:${pw}px;height:${ph+34}px"><div style="position:relative;width:${pw}px;height:${ph}px"><div style="transform:scale(${sc});transform-origin:0 0">${slideHTML(s,i,sl.length,c)}</div></div><button class="btn" style="margin-top:6px;padding:5px 10px" data-dl="${ci}:${i}">PNG</button></div>`).join("")}</div>
  <div class="row"><button class="btn" data-all="${ci}">Download all slides</button></div>
  <div class="cap">${["instagram","x","youtube","linkedin"].filter(p=>c.captions&&c.captions[p]).map(p=>`<details><summary>${{instagram:"Instagram caption",x:"X / Twitter thread",youtube:"YouTube community / Shorts script",linkedin:"LinkedIn post"}[p]}</summary><pre>${E(c.captions[p])}</pre><button class="btn" data-cp="${ci}:${p}">Copy</button></details>`).join("")}</div></section>`}).join("")}
async function png(ci,i){const c=data[ci].data,s=c.slides[i],[W,H]=SZ[fmt];const h=document.createElement("div");h.style.cssText="position:fixed;left:-99999px;top:0";h.innerHTML=slideHTML(s,i,c.slides.length,c);document.body.appendChild(h);
  const el=h.firstElementChild;await Promise.all([...el.querySelectorAll("[style*='url(']")].map(x=>{const m=x.getAttribute("style").match(/url\('([^']+)'\)/);return m?new Promise(r=>{const im=new Image();im.crossOrigin="anonymous";im.onload=im.onerror=r;im.src=m[1].replace(/&amp;/g,"&")}):0}));
  const cv=await html2canvas(el,{width:W,height:H,scale:1,useCORS:true,backgroundColor:"#0d1017"});h.remove();
  const a=document.createElement("a");a.download=(data[ci].id+"-"+(i+1)+"-"+fmt+".png");a.href=cv.toDataURL("image/png");a.click()}
document.addEventListener("click",async e=>{const f=e.target.closest("[data-f]");if(f){fmt=f.dataset.f;document.querySelectorAll("#fmt button").forEach(b=>b.setAttribute("aria-pressed",b===f));render();return}
  const d=e.target.closest("[data-dl]");if(d){const[a,b]=d.dataset.dl.split(":").map(Number);msg("Rendering…");try{await png(a,b)}catch(_){msg("Couldn't render, try again")}return}
  const al=e.target.closest("[data-all]");if(al){const ci=+al.dataset.all;msg("Rendering all…");for(let i=0;i<data[ci].data.slides.length;i++){try{await png(ci,i)}catch(_){}await new Promise(r=>setTimeout(r,350))}return}
  const cp=e.target.closest("[data-cp]");if(cp){const[a,p]=cp.dataset.cp.split(":");try{await navigator.clipboard.writeText(data[+a].data.captions[p]);msg("Copied")}catch(_){msg("Copy failed")}}});
fetch("/data/carousels.json",{cache:"no-cache"}).then(r=>r.json()).then(j=>{data=j;render()}).catch(()=>{document.getElementById("list").innerHTML='<p class="sub">Could not load carousels.</p>'});
})();
</script></body></html>

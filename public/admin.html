<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Spill Push Desk</title>
<style>
:root{--bg:#0b0b0c;--card:#17171a;--line:#2e2e33;--fg:#eef1f3;--mut:#9aa5ad;--or:#ff4500;--gr:#46d160;--rd:#ff6b6b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:14px}
h1{margin:0;font-size:24px;display:flex;align-items:center;gap:10px}h1 i{width:34px;height:34px;border-radius:50%;background:var(--or);display:grid;place-items:center;font-style:normal;font-size:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px}
label{font-size:12.5px;font-weight:700;color:var(--mut);display:grid;gap:5px}
input,textarea,select{font:inherit;color:var(--fg);background:#0f0f11;border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:72px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
button{font:inherit;font-weight:800;border:0;border-radius:999px;padding:12px 18px;cursor:pointer}
.send{background:var(--or);color:#fff}.ghost{background:#24242a;color:var(--fg)}
button:disabled{opacity:.5;cursor:default}
.stats{display:flex;gap:10px}.stat{flex:1;background:#0f0f11;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:24px}.stat span{font-size:12px;color:var(--mut)}
.prev{background:#1f1f24;border:1px solid #3a3a42;border-radius:18px;padding:12px 14px;display:flex;gap:12px}
.prev i{width:38px;height:38px;border-radius:9px;background:var(--or);display:grid;place-items:center;font-style:normal;flex:none}
.prev small{color:var(--mut);font-size:12px}.prev b{display:block}.prev span{font-size:14px;color:#cfd6db}
.msg{font-weight:700;font-size:14px}.ok{color:var(--gr)}.err{color:var(--rd)}
.log{display:grid;gap:8px;font-size:13.5px}.log div{border-top:1px solid var(--line);padding-top:8px}.log small{color:var(--mut)}
.count{font-size:12px;color:var(--mut);text-align:right}
.tips{font-size:13px;color:var(--mut);margin:0;padding-left:18px}
</style></head>
<body><div class="wrap">
  <h1><i>☕</i>Spill Push Desk</h1>

  <div class="card" id="auth">
    <label>Admin code<input id="tok" type="password" autocomplete="off" placeholder="Paste your admin code"></label>
    <button class="ghost" id="unlock">Unlock</button>
    <div class="msg" id="amsg"></div>
  </div>

  <div class="card" id="desk" hidden>
    <div class="stats"><div class="stat"><b id="cNews">–</b><span>Breaking news</span></div><div class="stat"><b id="cCric">–</b><span>Cricket</span></div><div class="stat"><b id="cAll">–</b><span>Anyone</span></div></div>
    <label>Title <input id="title" maxlength="80" placeholder="🚰 Water supply cut in 20 areas tomorrow"></label>
    <div class="count" id="tc">0/80</div>
    <label>Message <textarea id="body" maxlength="180" placeholder="6 am–6 pm in Kukatpally, Madhapur & more. Store water tonight. Full list inside."></textarea></label>
    <div class="count" id="bc">0/180</div>
    <div class="row">
      <label>Opens <input id="url" placeholder="/#s/story-id  or  https://…" value="/"></label>
      <label>Send to <select id="topic"><option value="news">Breaking-news subscribers</option><option value="cricket">Cricket subscribers</option><option value="all">Everyone with alerts on</option></select></label>
    </div>
    <div class="prev"><i>☕</i><div><small>SPILL · now</small><b id="pt">Your title</b><span id="pb">Your message</span></div></div>
    <div class="row"><button class="ghost" id="test">Send test (1 device)</button><button class="send" id="go">Send</button></div>
    <div class="msg" id="msg"></div>
    <ul class="tips"><li>Max 2 a day. Only for news people must know now.</li><li>Lead with the impact: what, where, when, what to do.</li><li>Link to a Spill story (<code>/#s/&lt;id&gt;</code>) or the official page.</li></ul>
  </div>

  <div class="card" id="logc" hidden><b>Recent pushes</b><div class="log" id="log"></div></div>
</div>
<script>
const FN="https://tvhfqkvyfkqxxiqxavjp.supabase.co/functions/v1/notify";
const $=id=>document.getElementById(id);
const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}},set=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let TOK=get("spill.admin")||"";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function info(){
  const r=await fetch(FN+"?info=1",{headers:{"x-admin-token":TOK}});const j=await r.json();
  if(!j.ok){$("amsg").textContent=j.error||"Couldn't unlock";$("amsg").className="msg err";$("auth").hidden=false;$("desk").hidden=true;return false}
  $("auth").hidden=true;$("desk").hidden=false;$("logc").hidden=false;
  $("cNews").textContent=j.counts.news;$("cCric").textContent=j.counts.cricket;$("cAll").textContent=j.counts.total;
  $("log").innerHTML=(j.log||[]).map(x=>`<div><b>${esc(x.title)}</b> ${x.body?"· "+esc(x.body):""}<br><small>${new Date(x.created_at).toLocaleString("en-IN",{timeZone:"Asia/Kolkata"})} · sent to ${x.sent||0}</small></div>`).join("")||"<small>Nothing sent yet.</small>";
  return true}
$("unlock").onclick=async()=>{TOK=$("tok").value.trim();if(await info())set("spill.admin",TOK)};
const upd=()=>{$("pt").textContent=$("title").value||"Your title";$("pb").textContent=$("body").value||"Your message";$("tc").textContent=$("title").value.length+"/80";$("bc").textContent=$("body").value.length+"/180"};
["title","body"].forEach(i=>$(i).addEventListener("input",upd));
async function send(test){
  const t=$("title").value.trim();if(!t){$("msg").textContent="Add a title first.";$("msg").className="msg err";return}
  if(!test&&!document.getElementById("go").dataset.armed){$("go").dataset.armed="1";$("go").textContent="Tap again to send";setTimeout(()=>{delete $("go").dataset.armed;$("go").textContent="Send"},4000);return}
  $("go").disabled=$("test").disabled=true;$("msg").textContent="Sending…";$("msg").className="msg";
  try{const r=await fetch(FN,{method:"POST",headers:{"content-type":"application/json","x-admin-token":TOK},body:JSON.stringify({title:t,body:$("body").value.trim(),url:$("url").value.trim()||"/",topic:$("topic").value,test})});const j=await r.json();
    if(j.ok){$("msg").textContent=`Sent to ${j.sent} of ${j.audience} device${j.audience===1?"":"s"}${j.removed?` · ${j.removed} expired removed`:""}.`;$("msg").className="msg ok"}else{$("msg").textContent=j.error||"Send failed";$("msg").className="msg err"}
  }catch(e){$("msg").textContent="Network error. Try again.";$("msg").className="msg err"}
  $("go").disabled=$("test").disabled=false;delete $("go").dataset.armed;$("go").textContent="Send";info()}
$("go").onclick=()=>send(false);$("test").onclick=()=>send(true);
if(TOK)info();
</script>
</body></html>
